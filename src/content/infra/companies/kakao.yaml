        - "<b>카카오계정·카카오 로그인(7·14):</b> 외부 사이트가 카카오 로그인을 붙이는 OAuth 흐름과 패스키 등록·복구 흐름. 연동한 서비스 쪽 결함이면 신고처가 다름."
