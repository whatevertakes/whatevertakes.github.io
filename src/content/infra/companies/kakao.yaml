        - "<b>카카오페이(14·15):</b> 결제 금액·주문 상태 같은 비즈니스 로직과 제3자 제공 흐름. 계열사라 신고 창구와 범위를 따로 확인."
        - "<b>카카오T(14·13):</b> 승객·기사·운영자 역할 간 권한 분리와 위치 정보 노출. 카카오모빌리티는 KISA 신고포상제 공동 운영사."
        - "<b>ChatGPT for Kakao·카나나(16):</b> 채팅방 대화가 AI 입력으로 들어갈 때의 프롬프트 인젝션과 정보 노출."
        - "<b>카카오클라우드 콘솔(9·4):</b> IAM과 쿠버네티스 엔진의 테넌트 경계. 테스트는 자기 계정 안에서만."
      note: 실제 이용자 데이터에 접근하거나 서비스를 방해하는 테스트는 하지 않습니다. 범위 밖 자산(계열사 포함)은 각 프로그램 규칙을 확인하기 전에는 건드리지 않습니다.
