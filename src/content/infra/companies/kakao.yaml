deep:
  summary: 카카오의 서비스가 어떤 인프라 위에 있고, 각 영역에서 무엇이 위험하며, 실제로 어떤 사건이 있었는지를 공개 자료(회사 발표, 정부 발표, 언론 보도)로 정리했습니다. 카카오 내부 구조를 확인한 것은 아니며, 보도만 있는 내용은 문장 안에 표시했습니다.
  facts:
    - label: 물리
      value: 판교 임차 → 자체 데이터센터
      detail: 2022년 화재 때는 SK C&C 판교 센터에 서버 약 3만2천 대를 둔 구조. 첫 자체 센터인 안산은 2024-01 가동, 남양주 제2센터는 2029 준공 목표
    - label: 대표 사건
      value: 2022 판교 화재 장기 장애
      detail: 배터리실 발화로 UPS까지 멈추고, 운영 도구가 판교 안에만 있어 복구가 늦어짐. 주요 서비스 장애 최대 약 127시간(보도 기준)
    - label: 개인정보
      value: 오픈채팅 과징금 151억 원
      detail: 2024-05 개인정보위 처분(당시 역대 최대). 2026-01 1심에서 카카오 패소, 항소 진행 중(보도 기준)
    - label: 컨테이너
      value: 온프레미스 쿠버네티스 대규모 운영
      detail: CNCF 사례 기준 OpenStack 위에서 클러스터 7천 개 이상, 노드 12만 대 이상을 Cilium으로 운영
