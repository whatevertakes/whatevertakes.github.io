      items:
        - "<b>1 → 11:</b> 판교 화재 공식 원인 분석과 정부 조사 결과를 읽고, 단일 센터 집중과 운영 도구 이중화 누락을 정리한다."
        - "<b>14 → 6 → 7:</b> 오픈채팅 사건을 개인정보위 발표와 1심 판결 보도로 다시 읽고 식별자 설계를 정리한다."
        - "<b>10 → 11:</b> 2024-05 장애 3건을 변경관리 관점에서 보고 사전테스트·작업 통제가 왜 필요한지 쓴다."
        - "<b>4 → 9:</b> CNCF 카카오 사례로 대규모 쿠버네티스·Cilium 구조를 보고, 카카오클라우드 Kubernetes Engine을 직접 만져 본다."
        - "<b>8 → 15:</b> 카카오워크 사건과 카카오페이 알리페이 건으로 자회사·협력사 경계를 정리한다."
        - "<b>16:</b> Kanana Safeguard를 내려받아 가드레일이 무엇을 막는지 실험한다."
      note: 영역마다 블로그 글 한 편으로 마무리하면 「카카오 인프라 해부」 시리즈가 됩니다.
