  areas:
    "1":
      level: hi
      here: 2022년까지 메인 서버를 SK C&C 판교 데이터센터(임차)에 둠. 화재 후 첫 자체 센터인 안산(한양대 ERICA 캠퍼스, 서버 12만 대 규모)을 2023-09 준공, 2024-01 가동. UPS실과 배터리실을 방화 격벽으로 나누고 서버·배터리·UPS를 지상층에 둠. 남양주에 제2센터(약 6,000억 원, 2029 준공 목표) 계획.
      risk: 판교 화재는 지하 3층 배터리실에서 시작됐고 배터리와 UPS가 물리적으로 완전히 분리되지 않아 UPS까지 멈춤(정부 발표). 한 건물에 서버가 몰려 있으면 물리 사고가 곧 전 서비스 장애. 이후 정부는 배터리실 안에 UPS 등 다른 전기설비를 두지 않게 하는 기준을 마련.
      study: 데이터센터 전력 구조(한전-UPS-발전기), 리튬이온 배터리 열폭주, Active-Active 이중화, 방송통신재난관리 제도.
      sources:
        - title: 정부 조사 결과(화재모니터링·백업 미흡)
          url: https://www.etnews.com/20221206000169
        - title: 정부 재발 방지 대책(배터리 간격·설비 분리)
          url: https://www.newsis.com/view/NISX20230330_0002247066
        - title: 카카오 데이터센터 안산 공개
          url: https://www.kakaocorp.com/page/detail/11097
        - title: 카카오 데이터센터 (2) 재해 대비책
          url: https://www.kakaocorp.com/page/detail/10860
        - title: 남양주 디지털 허브 협약
          url: https://www.kakaocorp.com/page/detail/11592
    "2":
      level: mid
      here: 판교 화재 후 데이터센터 간 이중화를 마쳤고, 대용량 트래픽 서비스의 데이터센터 간 삼중화를 위해 별도 전용망을 구성하겠다고 발표(2022-12). 카카오톡 메시지 송수신은 전 국민 규모 트래픽.
      risk: 센터 간 전환(failover)이 네트워크·전환 시스템에 달려 있음. 판교 화재 때는 전환을 돕는 일부 시스템이 같이 멈춰 다른 센터로 넘어가지 못한 것이 근본 원인이라고 카카오가 설명. 대규모 DDoS도 상시 위협.
      study: 데이터센터 간 전용망, GSLB·DNS 기반 전환, L4/L7 로드밸런서, 메시지 전송 프로토콜.
      sources:
        - title: 카카오 재발 방지 대책(인프라)
          url: https://www.kakaocorp.com/page/detail/9901
    "3":
      level: lo
      here: 판교 센터에만 서버 약 3만2천 대가 있었고 화재로 전부 다운됐다고 카카오 부사장이 설명(2022-10). 서버 OS 구성은 공개 자료가 적음. 단말 쪽으로는 카카오톡 모바일·PC 앱을 직접 배포.
      risk: 대량 서버를 한꺼번에 다시 올릴 때 설치 환경 정보와 자동화 도구가 없으면 복구가 늦어짐. PC 메신저 클라이언트는 사용자 단말에 깔리는 코드라 업데이트 경로가 공격 표면.
      study: 대규모 서버 재기동(cold start) 절차, Linux 서버 하드닝, 데스크톱 앱 자동 업데이트 보안.
      sources:
        - title: "카카오 부사장: 3.2만대 서버 전체 다운"
          url: https://mobile.newsis.com/view/NISX20221016_0002049472
    "4":
      level: mid
      here: CNCF 사례에 따르면 카카오는 OpenStack 위 온프레미스 쿠버네티스로 클러스터 7천 개 이상, 노드 12만 대 이상을 운영하고, 네트워크를 eBPF 기반 Cilium(kube-proxy 대체 모드)으로 바꿈. 카카오엔터프라이즈는 Cluster API로 사내 쿠버네티스를 서비스로 제공하는 사례를 if(kakao)dev 2022에서 발표.
      risk: 클러스터 수가 많을수록 버전·권한 설정이 흩어지기 쉬움. 컨테이너 탈출이나 과한 RBAC 권한은 같은 노드·클러스터의 다른 서비스로 번짐.
      study: 쿠버네티스 RBAC·네트워크 정책, Cilium·eBPF 구조, Cluster API, 컨테이너 탈출 N-day.
      sources:
        - title: CNCF 사례 연구(Kakao)
          url: https://www.cncf.io/case-studies/kakao/
        - title: 카카오엔터프라이즈 기술블로그(if kakao 2022 쿠버네티스 세션)
          url: https://tech-kakaoenterprise.tistory.com/178
    "5":
      level: mid
      here: 안산 센터는 6EB 저장 규모로 발표. 판교 화재 때는 서버 이전·재설치에 필요한 환경 정보가 판교 안에 있어 조회에 한계가 있었다고 카카오가 밝힘(2022-12).
      risk: 데이터는 복제돼 있어도 복구에 필요한 설정·메타데이터·백업이 같은 장소에 있으면 소용이 없음. 사진·파일 같은 대용량 저장소는 권한 설정 실수 시 대량 노출.
      study: 백업 3-2-1 원칙, 설정·메타데이터 백업, 오브젝트 스토리지 권한 모델.
      sources:
        - title: if(kakao) 2022 재발 방지 발표 보도
          url: https://biz.newdaily.co.kr/site/data/html/2022/12/07/2022120700110.html
        - title: 카카오 데이터센터 안산 준공
          url: https://www.kakaocorp.com/page/detail/10638
    "6":
      level: hi
      here: 카카오는 일반채팅과 오픈채팅에 같은 회원일련번호를 쓰고, 오픈채팅에서는 오픈채팅방 ID와 회원일련번호를 합친 임시 ID를 메시지 송수신에 썼음. 2020-08 이전 방은 임시 ID를 암호화하지 않았다고 개인정보위가 발표.
      risk: 내부 식별자를 그대로 노출하면 다른 기능에서 얻은 정보와 결합돼 익명성이 깨짐(2023 오픈채팅 사건). 카카오는 임시 ID만으로는 개인 식별이 안 된다고 반박했지만 1심 법원은 결합된 DB 판매를 유출로 봄(보도 기준).
      study: 식별자 설계(가명화·토큰화), 데이터 결합 위험, 개인정보 판단 기준(결합 용이성).
      sources:
        - title: 개인정보위 과징금 151억 보도
          url: https://m.boannews.com/html/detail.html?idx=130023
        - title: "개인정보위: 회원번호로 식별 불가 주장 수긍 어려워"
          url: https://m.etnews.com/20240605000246
    "7":
      level: hi
      here: 카카오계정 하나로 카카오톡과 외부 사이트(카카오 로그인, OAuth)에 로그인. 2024-11 카카오계정에 웹 기반 패스키 로그인을 도입해 카카오 로그인을 쓰는 외부 서비스에서도 쓸 수 있게 함.
      risk: 계정 하나에 메신저·결제·모빌리티가 엮여 있어 계정 탈취 피해가 큼. 판교 화재 때 카카오T·카카오맵 등 카카오 계정과 연계된 서비스도 접속이 안 됐다는 보도처럼 인증 장애도 전 서비스로 번짐(보도 기준).
      study: OAuth 2.0·OIDC 흐름, 패스키(FIDO2) 원리, 계정 복구 절차의 보안.
      sources:
        - title: 카카오계정 패스키 도입
          url: https://www.kakaocorp.com/page/detail/11349
        - title: Kakao Developers 보안 관련 약관
          url: https://developers.kakao.com/terms/latest/ko/security
    "8":
      level: hi
      here: 업무 메신저 카카오워크를 외부 기업에 판매. 2026-11-01 운영 자회사 디케이테크인에서 카카오로 서비스 주체가 바뀌었고, 실제 운영은 디케이테크인이 맡고 있다는 보도.
      risk: 2026-11-09 카카오워크 시스템에 외부 공격자의 비정상 접근이 확인됨. 이름·부서·전화번호·이메일, 메일 본문·첨부파일, 암호화 메시지까지 유출 항목에 포함됐다는 보도. 피해 규모는 고객사 44곳 약 5천 명이라는 보도와 미공개라는 보도가 엇갈림(보도 기준, 조사 중).
      study: 협업 SaaS의 테넌트 분리, 서비스 이관 시 권한·계정 정리, 종단간 암호화의 한계(키 관리).
      sources:
        - title: 카카오워크 해킹 보도(보안뉴스)
          url: https://www.boannews.com/news/articleView.html?idxno=147242
        - title: 카카오 기업용 메신저 유출(시사저널)
          url: https://www.sisajournal.com/news/articleView.html?idxno=393928
    "9":
      level: mid
      here: 카카오엔터프라이즈가 카카오클라우드를 운영하며 관리형 쿠버네티스(Kubernetes Engine)를 제공. 2021년 공공용 카카오 i 클라우드로 CSAP(IaaS) 인증, 2025-09 하이브리드 GPUaaS 출시. 계열사 카카오모빌리티는 온프레미스에 구글 클라우드 GKE를 더한 멀티 클라우드 이중화 구성을 공개.
      risk: 클라우드 사업자로서 IAM·테넌트 경계, 공공 클라우드 요건이 붙음. 멀티 클라우드는 장애에 강하지만 계정·비밀값 관리 지점이 늘어남.
      study: 카카오클라우드 Kubernetes Engine 실습, 멀티 클라우드 IAM, CSAP 요건 읽기.
      sources:
        - title: 공공기관용 카카오 i 클라우드 출시
          url: https://www.kakaocorp.com/page/detail/9504
        - title: 카카오클라우드 Kubernetes Engine 튜토리얼
          url: https://docs.kakaocloud.com/en/tutorial/container/k8s-engine-k8s-cluster
        - title: 카카오모빌리티 GKE 사례
          url: https://cloud.google.com/customers/kakaomobility?hl=ko
