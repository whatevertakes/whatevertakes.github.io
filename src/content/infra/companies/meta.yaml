  timeline:
    - { date: "2011", text: "Open Compute Project로 Prineville 데이터센터·서버 설계 공개. 같은 해 버그바운티 시작" }
    - { date: "2018-09", text: "'View As' 기능 결함 3개가 겹쳐 액세스 토큰 탈취. 약 2,900만 계정 정보 조회, 약 9,000만 계정 로그아웃 처리", bad: true }
    - { date: "2019-05", text: "WhatsApp 음성통화(VoIP) 버퍼 오버플로(CVE-2019-3568) 제로클릭 악용. NSO 스파이웨어 유포에 쓰였다는 보도", bad: true }
    - { date: "2021-10", text: "백본 명령 실수 → BGP 철회 → DNS 접근 불가로 전 서비스 약 6시간 중단(Meta 사후 분석)", bad: true }
    - { date: "2022-11", text: "연락처 가져오기 기능 악용 스크래핑(5억여 명)으로 아일랜드 DPC 2억 6,500만 유로 과징금. 같은 달 내부 도구로 계정을 넘긴 직원·협력사 징계 보도", bad: true }
    - { date: "2022-12", text: "PyTorch nightly 의존성 혼동 공격(가짜 torchtriton)", bad: true }
    - { date: "2023-03", text: "연구자 한정 배포하던 LLaMA 가중치가 토렌트로 유출", bad: true }
    - { date: "2023-12", text: "Messenger 개인 대화 종단간 암호화 기본 적용 시작, Labyrinth 백업 프로토콜 공개" }
    - { date: "2024-12", text: "아일랜드 DPC, 2018 토큰 유출로 2억 5,100만 유로 과징금(Meta는 항소 의사)", bad: true }
    - { date: "2025-08", text: "WhatsApp 연결 기기 동기화 권한 검사 결함(CVE-2025-55177)이 Apple 취약점과 함께 표적 공격에 쓰였을 수 있다고 Meta 발표", bad: true }
    - { date: "2026-05", text: "Instagram AI 지원 계정 복구 도구 결함으로 2만여 계정 탈취(Meta 신고 20,225명). 도구 중단", bad: true }
    - { date: "2026-10", text: "오하이오 Prometheus 기가와트급 AI 슈퍼클러스터 1단계 완료 발표" }
  use:
    - title: 버그바운티로 볼 만한 곳 (범위·규칙 확인이 먼저)
      style: ul
      items:
        - "<b>계정·토큰(7):</b> 로그인, 액세스 토큰 범위, 계정 복구 흐름. 2018·2026 사건 모두 여기서 터짐. 반드시 본인 테스트 계정끼리만 확인."
        - "<b>기능 간 상호작용(14):</b> 한 기능 안에 다른 기능이 끼어 들어갈 때 권한이 바뀌는지. 'View As' 사례처럼 단독으로는 무해한 결함의 조합을 본다."
        - "<b>객체 권한 검사(14·6):</b> 게시물·메시지·AI 대화처럼 ID로 가리키는 객체에 권한 검사가 있는지(IDOR). 2025 Meta AI 사례 참고."
        - "<b>Meta AI(16):</b> AI 기능이 어떤 데이터와 권한에 닿는지. AI 관련 결함 중 무엇이 보상 대상인지는 정책 문서에서 먼저 확인."
        - "<b>Quest·Horizon OS(13):</b> 하드웨어도 범위. 앱 간 경계, 시스템 서비스 IPC를 공부 방향으로 삼는다."
        - "<b>WhatsApp·Messenger(12·7):</b> 다중 기기 연결과 연락처 조회. 대량 조회 테스트는 실제 이용자 정보 수집이 되므로 규칙 확인 전 금지."
      note: "실제 이용자 데이터 접근·대량 수집·서비스 방해는 금지이며, 본인 테스트 계정과 범위 안 자산만 대상으로 한다."
    - title: 이 해부로 공부하는 순서
      style: ol
      items:
        - "<b>2 → 11:</b> 2021 장애 사후 분석으로 BGP·DNS와 헬스체크가 장애를 키우는 구조, 대역외 복구 경로를 익힌다."
        - "<b>10 → 2:</b> 위험한 운영 명령을 막는 감사 도구와 점진 배포(Conveyor)를 본다."
        - "<b>14 → 7:</b> 2018 'View As' 기술 설명을 읽고 기능 조합이 토큰 노출로 이어진 과정을 그린다."
        - "<b>6 → 4:</b> TAO·MyRocks·Twine 논문으로 거대 서비스의 데이터·컨테이너 계층을 이해한다."
        - "<b>16 → 7:</b> 2026 AI 지원 도구 사건으로 AI에 권한을 줄 때의 검증 누락을 해부한다."
        - "<b>15:</b> torchtriton 의존성 혼동과 LLaMA 가중치 유출로 오픈소스·모델 배포 공급망을 정리한다."
      note: "각 단계마다 출처의 원문(사후 분석, 감독기관 결정)을 직접 읽고 사실과 추정을 나눠 메모한다."
