tip: 장애 사후 분석이 공개돼 네트워크(2) 공부에 최고. 바운티는 인증·토큰(7)과 기능 간 상호작용 결함이 많음.
blog: https://engineering.fb.com/
deep:
  summary: "Meta의 서비스(Facebook·Instagram·WhatsApp·Messenger·Threads·Meta AI·Quest)가 어떤 인프라 위에 있고, 영역마다 무엇이 위험하며, 실제로 어떤 사건이 있었는지를 엔지니어링 블로그·공식 발표·감독기관 결정·주요 보도로 정리했습니다. Meta 내부 구조를 직접 확인한 것은 아니며 일부는 보도 기준이거나 일반론입니다."
  facts:
    - label: 물리
      value: "자체 데이터센터 + 기가와트급 AI 클러스터"
      detail: "2011년 Prineville 데이터센터 설계를 Open Compute Project로 공개. 2026-10 오하이오 Prometheus 1단계 완료, 루이지애나 Hyperion 건설 중."
    - label: 네트워크
      value: "자체 백본(EBB)"
      detail: "데이터센터 간 전용 백본 Express Backbone을 직접 운영. 2021-10 백본 명령 하나로 전 서비스 약 6시간 중단."
    - label: 신고 채널
      value: "Meta Bug Bounty(2011~)"
      detail: "2025년 한 해 400만 달러 이상, 누적 2,500만 달러 이상 지급(Meta 발표). Quest 등 하드웨어도 범위에 포함."
    - label: 대표 사건
      value: "2018 'View As' 토큰 탈취"
      detail: "기능 결함 3개가 겹쳐 약 2,900만 계정 정보 조회. 2024-12 아일랜드 DPC가 2억 5,100만 유로 과징금 부과."
  services:
    - name: Facebook
      areas: { "1": related, "2": core, "4": related, "5": core, "6": core, "7": core, "11": related, "14": core }
    - name: Instagram
      areas: { "2": core, "5": core, "6": core, "7": core, "14": core, "16": related }
    - name: WhatsApp
      areas: { "2": core, "3": related, "5": related, "7": core, "12": core, "14": core }
    - name: Messenger
      areas: { "2": core, "5": related, "7": core, "12": core, "14": core }
    - name: Threads
      areas: { "2": related, "6": core, "7": core, "14": core }
    - name: Facebook 로그인·Graph API
      areas: { "6": related, "7": core, "12": related, "14": core }
    - name: 광고(Ads)
      areas: { "6": core, "11": related, "14": core, "16": related }
    - name: Meta AI
      areas: { "1": related, "7": related, "14": core, "16": core }
