      areas: { "1": core, "13": related, "15": core, "16": core }
    - name: Quest·Horizon OS(Reality Labs)
      areas: { "3": core, "13": core, "14": related, "15": related }
    - name: AI 학습 클러스터(Prometheus 등)
      areas: { "1": core, "2": core, "4": related, "9": related, "11": core, "13": core, "16": core }
  areas:
    "1":
      level: mid
      here: "자체 데이터센터를 직접 짓고 운영. 2011년 Prineville 데이터센터와 서버 설계를 Open Compute Project로 공개함. 2026-10 오하이오 New Albany의 AI 슈퍼클러스터 Prometheus 1단계 완료를 발표했고, 루이지애나 Hyperion을 건설 중. 운영·건설 중인 데이터센터는 30여 곳(보도 기준)."
      risk: "2021 장애 때 원격 접속이 끊겨 엔지니어가 현장에 가야 했고, 물리 보안 절차 때문에 복구가 더 늦어졌다고 Meta가 설명함. 물리 보안과 비상 접근 절차가 서로 부딪히는 지점이 핵심."
      study: "데이터센터 전력·냉각 설계(OCP), 비상 시 현장 접근 절차와 물리 보안의 균형."
      sources:
        - title: "Facebook Launches Open Compute Project"
          url: https://about.fb.com/news/2011/04/facebook-launches-open-compute-project/
        - title: "Inside Prometheus (Engineering at Meta)"
          url: https://engineering.fb.com/2026/10/19/data-center-engineering/inside-prometheus-meta-gigawatt-scale-supercluster/
        - title: "Meta 데이터센터 전략 보도(Data Center Frontier)"
          url: https://www.datacenterfrontier.com/hyperscale/article/55310441/ownership-and-power-challenges-in-metas-hyperion-and-prometheus-data-centers
    "2":
      level: hi
      here: "데이터센터 간 트래픽은 자체 백본 Express Backbone(EBB)으로 연결(2017 공개). 분산 에이전트와 중앙 컨트롤러를 섞은 트래픽 엔지니어링, 평면(plane)을 나눈 구조. 2025년에는 AI용 백본 10배 확장을 발표."
      risk: "2021-10-04 백본 용량 점검 명령이 전 백본 연결을 끊었고, 데이터센터와 통신할 수 없게 된 DNS 서버가 스스로 BGP 광고를 철회해 facebook.com 등이 인터넷에서 사라짐. 보안 공격이 아니라 운영 실수로도 전 서비스가 멈출 수 있다는 사례."
      study: "BGP 광고·철회, Anycast DNS, 헬스체크가 장애를 키우는 구조, 백본 트래픽 엔지니어링."
      sources:
        - title: "More details about the Oct. 4 Facebook outage"
          url: https://engineering.fb.com/2021/10/05/networking-traffic/outage-details/
        - title: "Building Express Backbone"
          url: https://engineering.fb.com/2017/05/01/data-center-engineering/building-express-backbone-facebook-s-new-long-haul-network/
        - title: "10X Backbone: AI 시대 백본 확장"
          url: https://engineering.fb.com/2025/10/16/data-center-engineering/10x-backbone-how-meta-is-scaling-backbone-connectivity-for-ai/
    "3":
      level: lo
      here: "OCP 설계를 바탕으로 한 자체 사양 서버를 대량으로 운영. Twine이 수백만 대 서버에 컨테이너를 배치한다고 Meta가 설명함. 단말 쪽은 iOS·Android·macOS용 앱과 Quest용 Horizon OS."
      risk: "자체 사양 서버는 펌웨어·BMC 같은 관리 계층까지 직접 책임짐. 단말 앱은 OS 취약점과 엮여 공격됨(2025 WhatsApp 결함은 Apple ImageIO 취약점과 함께 악용된 것으로 Meta가 평가)."
      study: "서버 펌웨어·BMC 보안, 모바일 앱과 OS 취약점 체인의 구조."
      sources:
        - title: "Building efficient data centers with the Open Compute Project"
          url: https://engineering.fb.com/2011/04/07/data-center-engineering/building-efficient-data-centers-with-the-open-compute-project/
    "4":
      level: mid
      here: "자체 클러스터 관리 시스템 Twine(옛 Tupperware, 2011년 시작)이 거의 모든 서비스의 컨테이너를 관리. 한 지역의 서버 100만 대를 단일 제어 평면으로 다루고, 상태 저장 서비스(ZooKeeper 등)도 올림(OSDI 2020)."
      risk: "단일 제어 평면은 한 번의 잘못된 명령·설정이 대규모로 번질 수 있음. 컨테이너 격리와 제어 평면 권한이 내부 공격자 관점의 핵심 표적(일반론)."
      study: "Twine 논문과 Kubernetes 비교, 제어 평면 권한 분리, 컨테이너 격리."
      sources:
        - title: "Efficient, reliable cluster management at scale with Twine"
          url: https://engineering.fb.com/2019/06/06/data-center-engineering/twine/
        - title: "Twine (OSDI 2020)"
          url: https://usenix.org/conference/osdi20/presentation/tang
    "5":
      level: mid
      here: "사진·영상 같은 BLOB은 Haystack(핫)과 f4(웜)로 나눠 저장한다고 논문으로 공개(f4는 2014년 기준 65PB 이상). 메시지 쪽은 Messenger의 종단간 암호화 백업 프로토콜 Labyrinth를 공개."
      risk: "대용량 미디어 저장소는 URL·접근 권한 설계 실수가 곧 대량 노출. 암호화 백업은 복구 키 관리가 약점이 되기 쉬움(일반론)."
      study: "BLOB 스토리지 설계(Haystack·f4 논문), 종단간 암호화 백업의 키 관리."
      sources:
        - title: "f4: Facebook's Warm BLOB Storage System (OSDI 2014)"
          url: https://www.usenix.org/conference/osdi14/technical-sessions/presentation/muralidhar
        - title: "Labyrinth 1.1 (Engineering at Meta)"
          url: https://engineering.fb.com/2026/05/11/security/labyrinth-1-1/
    "6":
      level: mid
      here: "소셜 그래프는 MySQL 위에 그래프 전용 캐시 TAO를 얹어 서빙(USENIX ATC 2013). 사용자 DB 계층(UDB)은 InnoDB에서 RocksDB 기반 MyRocks로 옮겨 저장 공간을 절반 가까이 줄임(2017 완료)."
      risk: "모든 기능이 같은 그래프 데이터를 읽으므로, 권한 검사가 빠진 조회 경로 하나가 대량 수집으로 이어짐. 연락처 가져오기 기능을 악용한 스크래핑으로 5억여 명 정보가 퍼졌고, 2022-11 아일랜드 DPC가 2억 6,500만 유로 과징금 부과."
      study: "TAO 논문(객체·연관 모델, 캐시 일관성), MyRocks 이전 사례, 스크래핑과 속도 제한."
      sources:
        - title: "TAO: Facebook's Distributed Data Store for the Social Graph"
          url: https://www.usenix.org/biblio/tao-facebook%E2%80%99s-distributed-data-store-social-graph
        - title: "Migrating a database from InnoDB to MyRocks"
          url: https://engineering.fb.com/2017/09/25/core-infra/migrating-a-database-from-innodb-to-myrocks/
        - title: "DPC 스크래핑 과징금 보도(TechCrunch)"
          url: https://techcrunch.com/2022/11/28/facebook-gdpr-penalty
    "7":
      level: hi
      here: "Facebook 로그인(외부 서비스용)과 앱 액세스 토큰, 계정 복구 절차, WhatsApp·Messenger의 종단간 암호화 키와 다중 기기 연결. 계정 복구는 사람(내부 도구)과 AI 지원 도구가 함께 처리."
      risk: "2018 'View As'에서 다른 사용자 이름으로 발급된 액세스 토큰이 페이지에 노출. 2026-04~05 Instagram의 AI 지원 계정 복구 도구가 요청자 이메일을 계정과 대조하지 않아 2만여 계정이 탈취됨(Meta 신고 20,225명, NYT는 약 3.4만으로 보도)."
      study: "OAuth 2.0 액세스 토큰 수명·범위, 계정 복구 흐름 위협 모델, 다중 기기 E2EE 키 관리."
      sources:
        - title: "Security Update (Facebook, 2018)"
          url: https://about.fb.com/news/2018/09/security-update/
        - title: "DPC 토큰 유출 결정"
          url: https://dataprotection.ie/en/dpc-guidance/decisions/inquiries-meta-platforms-ireland-limited-token-breach
        - title: "Meta says 20,000 Instagram accounts hacked via AI tool abuse"
          url: https://www.securityweek.com/meta-says-20000-instagram-accounts-hacked-via-ai-tool-abuse/
    "8":
      level: hi
      here: "사내 직원·협력사가 쓰는 계정 복구 내부 도구 'Oops'가 있었음(보도 기준). WhatsApp 전 보안 담당자는 엔지니어 약 1,500명이 이용자 데이터에 통제 없이 접근할 수 있었다고 소송을 냈고, Meta는 부인(미확인)."
      risk: "2022-11 WSJ 보도: 직원·보안 협력사 인력 20여 명이 내부 도구로 이용자 계정을 넘겨주다 징계·해고됐고 일부는 뇌물을 받음. 내부자 권한 남용과 협력사 관리가 핵심 위험."
      study: "내부 관리 도구의 최소 권한·접근 로그, 내부자 위협 탐지, 협력사 계정 관리."
      sources:
        - title: "Meta disciplined or fired workers for taking over user accounts (CNBC)"
          url: https://www.cnbc.com/2022/11/17/meta-disciplined-or-fired-employees-for-taking-over-user-accounts-wsj.html
        - title: "WhatsApp 전 보안 담당 소송 보도(CyberScoop)"
          url: https://cyberscoop.com/meta-whatsapp-lawsuit-privacy-violations-relatiation/
    "9":
      level: lo
      here: "퍼블릭 클라우드를 팔지 않고 자체 데이터센터가 중심. 다만 AI 연산이 모자라 Google Cloud(6년 100억 달러 이상), CoreWeave(약 142억 달러)와 대형 계약을 맺음(보도 기준)."
      risk: "외부 클라우드에 학습 작업·데이터를 올리면 자체 인프라와 다른 IAM·경계 관리가 필요(일반론)."
      study: "하이브리드(자체+임대) 구조의 IAM 경계, 클라우드 GPU 임대 계약의 책임 분담."
      sources:
        - title: "Meta Signs $10 Billion Google Cloud Deal (Bloomberg)"
          url: https://www.bloomberg.com/news/articles/2025-08-22/meta-signs-10-billion-google-cloud-computing-deal-amid-ai-race
        - title: "CoreWeave Inks $14 Billion Meta Deal (Bloomberg)"
          url: https://www.bloomberg.com/news/articles/2025-09-30/coreweave-inks-14-billion-meta-deal-in-latest-sign-of-ai-demand
    "10":
      level: hi
      here: "배포 시스템 Conveyor가 3만 개 이상 파이프라인을 관리하고, 컨테이너 기반 파이프라인의 55%가 변경마다 바로 배포(OSDI 2023). 소스는 Sapling으로 관리하는 대형 모노레포."
      risk: "2021 장애는 위험한 명령을 막아야 할 감사(audit) 도구의 버그가 출발점. 자동화·검증 도구 자체의 결함이 안전장치를 무력화할 수 있음."
      study: "점진 배포·자동 롤백, 위험 명령 사전 검증(변경 관리), 모노레포 권한 관리."
      sources:
        - title: "Conveyor (OSDI 2023)"
          url: https://www.usenix.org/conference/osdi23/presentation/grubic
        - title: "Sapling: source control"
          url: https://engineering.fb.com/2022/11/15/open-source/sapling-source-control-scalable/
    "11":
      level: mid
      here: "장애 사후 분석을 엔지니어링 블로그에 공개함(2021). AI 클러스터는 고장 데이터를 공개했는데, Prometheus 1단계 초기 GPU 8,000장당 하루 약 1,000건 중단을 크게 줄였다고 설명(보도 기준)."
      risk: "2021 장애 때 내부 도구·원격 접속도 같은 네트워크에 의존해 복구가 늦어짐. 관측·복구 경로가 본 서비스와 같은 장애 영역에 있으면 안 됨."
      study: "대역외(out-of-band) 관리망, 장애 사후 분석 읽기, 대규모 GPU 클러스터 장애 관측."
      sources:
        - title: "More details about the Oct. 4 Facebook outage"
          url: https://engineering.fb.com/2021/10/05/networking-traffic/outage-details/
        - title: "Meta Prometheus 장애 감소 보도(The Next Web)"
          url: https://thenextweb.com/news/meta-prometheus-supercluster-1-million-gpus-muse
    "12":
      level: mid
      here: "2011년부터 버그바운티 운영(2025년 약 1.3만 건 접수, 약 800건 보상). WhatsApp은 종단간 암호화 기본, Messenger는 2023-12부터 개인 대화 종단간 암호화 기본 적용 시작. Quest 2를 대상으로 자체 공격 연구도 공개."
      risk: "종단간 암호화가 있어도 클라이언트 구현 결함은 그대로 남음(2019·2025 WhatsApp 제로클릭). 감독기관은 설계 단계 보호(GDPR 25조) 위반을 이유로 거듭 과징금 부과."
      study: "버그바운티 정책 문서 읽기, Signal 프로토콜 계열 E2EE 구조, GDPR 25조(설계에 의한 보호)."
      sources:
        - title: "Meta Bug Bounty 15주년(2025)"
          url: https://bugbounty.meta.com/blog/15th-anniversary-2025/
        - title: "Building end-to-end security for Messenger"
          url: https://engineering.fb.com/2023/12/06/security/building-end-to-end-security-for-messenger/
        - title: "DPC 2억 5,100만 유로 과징금 발표"
          url: https://dataprotection.ie/en/news-media/press-releases/irish-data-protection-commission-fines-meta-eu251-million
    "13":
      level: mid
      here: "Reality Labs의 Quest 헤드셋(Horizon OS)은 Android 기반 단말 플랫폼. Meta는 Quest 2의 특권 VR 런타임 서비스를 직접 공격해 본 연구를 공개했고, AI 학습 클러스터는 별도 HPC 영역."
      risk: "헤드셋에 깔린 앱이 다른 앱이나 시스템 서비스를 공격하는 경로. 2025년 Quest에서 Unity 앱을 조작해 임의 코드 실행이 가능한 결함이 바운티로 신고돼 OS 수준 패치가 나옴."
      study: "Android 계열 앱 샌드박스와 IPC, XR 기기의 센서·카메라 데이터 보호, GPU 클러스터 스케줄러."
      sources:
        - title: "Meta Quest 2: Defense through offense"
          url: https://engineering.fb.com/2023/09/12/security/meta-quest-2-defense-through-offense/
        - title: "Meta Bug Bounty 15주년(2025, Quest 사례)"
          url: https://bugbounty.meta.com/blog/15th-anniversary-2025/
    "14":
      level: hi
      here: "웹 서버 코드는 PHP에 정적 타입을 더한 자체 언어 Hack과 런타임 HHVM으로 작성(2014 공개). Facebook·Instagram·WhatsApp·Messenger·Threads·Meta AI가 한 계정 체계와 그래프를 공유."
      risk: "기능끼리의 상호작용 결함이 대형 사고가 됨(View As + 영상 업로더). 2025-01 Meta AI에서 프롬프트 ID만 바꾸면 남의 대화를 볼 수 있던 권한 검사 누락이 바운티로 신고돼 수정."
      study: "기능 간 상호작용 결함 분석, IDOR(객체 단위 권한 검사), Hack/HHVM 구조."
      sources:
        - title: "Hack: a new programming language for HHVM"
          url: https://engineering.fb.com/2014/03/20/developer-tools/hack-a-new-programming-language-for-hhvm/
        - title: "Meta fixes bug that could leak users' AI prompts (TechCrunch)"
          url: https://techcrunch.com/2025/07/15/meta-fixes-bug-that-could-leak-users-ai-prompts-and-generated-content
    "15":
      level: mid
      here: "PyTorch(2022-09 PyTorch Foundation으로 이관), React, Llama 등 널리 쓰이는 오픈소스·모델의 원 제공자. Llama는 가중치를 내려받아 쓰는 형태로 배포."
      risk: "2022-12 PyTorch nightly가 공개 PyPI의 가짜 torchtriton 패키지를 끌어오는 의존성 혼동 공격을 당해 SSH 키 등이 유출될 수 있었음. 2023-03 연구자에게만 주던 LLaMA 가중치가 토렌트로 퍼짐(유출 경로는 미확인)."
      study: "의존성 혼동(dependency confusion), 패키지 인덱스 우선순위, 모델 가중치 배포·서명."
      sources:
        - title: "Compromised PyTorch-nightly dependency chain"
          url: https://pytorch.org/blog/compromised-nightly-dependency/
        - title: "Meta LLaMA leak (The Register)"
          url: https://www.theregister.com/2023/03/08/meta_llama_ai_leak
    "16":
      level: hi
      here: "2024년 H100 24,576장 클러스터 2개(RoCE, InfiniBand)로 Llama 3 학습. 2026-10 기가와트급 Prometheus 1단계 완료, 약 100만 GPU 규모로 확장 중. Meta AI를 각 앱에 붙이고 계정 지원에도 AI를 씀."
      risk: "AI가 권한 있는 작업(계정 복구)을 맡으면 검증 누락이 곧 대량 계정 탈취(2026 Instagram). AI 서비스의 권한 검사 누락(2025 Meta AI 프롬프트 노출), 모델 가중치 유출(2023)."
      study: "LLM 에이전트에 권한을 줄 때의 위협 모델(MITRE ATLAS), AI 학습 네트워크(RoCE·InfiniBand), 모델 가중치 보호."
      sources:
        - title: "Building Meta's GenAI Infrastructure"
          url: https://engineering.fb.com/2024/03/12/data-center-engineering/building-metas-genai-infrastructure/
        - title: "Meta says 20,000 Instagram accounts hacked via AI tool abuse"
          url: https://www.securityweek.com/meta-says-20000-instagram-accounts-hacked-via-ai-tool-abuse/
        - title: MITRE ATLAS
          url: https://atlas.mitre.org/
  paths:
