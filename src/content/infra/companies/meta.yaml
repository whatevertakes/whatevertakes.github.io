      steps:
        - { area: "10", label: "백본 용량 점검 명령, 감사 도구 버그로 차단 실패" }
        - { area: "2", label: "백본 전체 연결 단절" }
        - { area: "2", label: "DNS 서버가 스스로 BGP 광고 철회" }
        - { area: "1", label: "원격 복구 불가, 현장 출입·물리 보안 절차" }
        - { area: "14", label: "Facebook·Instagram·WhatsApp 약 6시간 중단" }
