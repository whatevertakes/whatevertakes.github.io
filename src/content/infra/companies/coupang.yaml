  areas:
    "1":
      level: hi
      here: 서비스 서버는 AWS 위에 있어 자체 데이터센터 공개 자료는 찾지 못함. 대신 전국 100여 곳 물류센터가 핵심 물리 자산. 2021-06 이천 덕평 물류센터 화재는 진화까지 6일, 2026-07 인천 물류센터 화재는 약 109시간 만에 진화.
      risk: 물류센터 화재·정전은 곧 배송 중단. 덕평 화재는 지하 2층 콘센트 스파크 등 전기적 요인이 추정 원인(보도 기준), 인천 화재 원인은 감정 중(보도 기준). 상자·비닐 같은 가연물이 많고 메자닌 구조가 화를 키웠다는 지적.
      study: 물류센터 소방 설비(스프링클러·방화셔터), 전기 화재 감식, 클라우드 리전 장애 대비.
      sources:
        - title: 덕평 화재 이후 안전 대책 보도
          url: https://www.newsis.com/view/NISX20260721_0003716860
        - title: 인천 물류센터 화재 합동감식
          url: https://www.newsis.com/view/NISX20260728_0003726301
    "2":
      level: mid
      here: 할인 행사 같은 순간 트래픽 폭주가 2017년 클라우드 이전의 이유로 소개됨. 엔지니어링 블로그는 마이크로서비스 데이터를 높은 가용성·처리량으로 제공하는 백엔드 전략을 공개. 쿠팡플레이 스트리밍 전송 구조는 공개 자료를 찾지 못함.
      risk: 대규모 DDoS, 이벤트 트래픽 폭주, CDN·API 게이트웨이 설정 오류. 게이트웨이가 토큰 서명만 맞으면 통과시키는 구조였다는 점이 2025 사건에서 드러남(7번 참고).
      study: CDN·L7 로드밸런서, API 게이트웨이의 인증 위임 구조, 스트리밍 전송 프로토콜.
      sources:
        - title: Our backend strategy to handle massive traffic
          url: https://medium.com/coupang-engineering/our-backend-strategy-to-handle-massive-traffic-d30cd6cc4fb2
        - title: 쿠팡 AWS 전면 이전(2017)
          url: https://byline.network/2017/08/10-6
    "3":
      level: lo
      here: 서버는 AWS EC2 위의 Linux가 중심으로 추정. 모바일 앱 CI 빌드도 물리 장비에서 AWS EC2로 옮긴 사례가 블로그에 공개됨.
      risk: OS·런타임 N-day 패치 지연, 빌드 머신 침해 시 앱 서명 자산 노출.
      study: EC2 하드닝, 모바일 빌드 머신 보안, 이미지(AMI) 패치 주기.
      sources:
        - title: Improving the CI/CD pipeline for mobile app development
          url: https://medium.com/coupang-engineering/improving-the-ci-cd-pipeline-for-mobile-app-development-80912546a4fd
    "4":
      level: mid
      here: 2018년부터 모놀리식에서 마이크로서비스로 전환해 수백 개 서비스로 운영한다고 블로그에 공개. ML 플랫폼은 모델마다 오토스케일링 서비스로 배포하는 구조로 소개되며 Kubernetes 기반으로 추정.
      risk: 서비스 수백 개면 서비스 간 인증과 권한 경계가 넓어짐. Kubernetes RBAC·시크릿 노출, 컨테이너 탈출 N-day.
      study: MSA 서비스 간 인증(mTLS·서비스 토큰), Kubernetes RBAC와 시크릿 관리.
      sources:
        - title: Integrating Coupang platform services to a microservice architecture
          url: https://medium.com/coupang-engineering/행복을-찾기-위한-우리의-여정-a31fc2d5a572
        - title: Meet Coupang's Machine Learning Platform
          url: https://medium.com/coupang-engineering/meet-coupangs-machine-learning-platform-cd00e9ccc172
    "5":
      level: mid
      here: 페타바이트급 데이터 플랫폼을 블로그에 공개. 앱 접속 기록은 6개월 단위로 보관했다고 보도됨. 2025-11 자료보전 명령 뒤에도 자동 삭제 정책을 바로 바꾸지 않아 2025-05-23~06-02 앱 로그 11일치가 사라짐(과기정통부 발표 보도).
      risk: 로그 보존 기간과 삭제 정책이 사고 조사 범위를 정함. 정부는 수사 의뢰와 과태료 처분. 백업·보존 정책이 법적 의무와 어긋나면 그 자체가 위반이 됨.
      study: 접속기록 보관 의무(개인정보 안전성 확보조치 기준), 로그 보존·법적 보전(legal hold) 설계.
      sources:
        - title: 자료보전명령 의혹 수사 보도
          url: https://www.mt.co.kr/society/2026/02/11/2026021109482538405
        - title: Data platform 2022
          url: https://medium.com/coupang-engineering/data-platform-2022-global-expansion-in-petabytes-3dbbbf27f6fe
    "6":
      level: hi
      here: 캐시 계층 하나가 60~100개 노드로 분당 최대 1억 요청을 처리한다고 블로그에 공개. 광고 DB에는 쿠팡 파트너스 광고가 실린 타사 사이트·앱 방문 기록(URL·IP·접속 일시)이 기기 식별자·회원번호와 함께 저장됨(개인정보위 판단).
      risk: 식별자와 결합된 행동 데이터는 그 자체로 개인정보. 개인정보위는 약 1,117만 명의 타사 활동기록 무단 수집에 약 2,011억 원 과징금 부과. 캐시·DB 대량 조회는 유출 규모를 키움.
      study: 캐시 계층 설계와 장애 대응, 개인정보 결합·가명처리, 광고 데이터 수집 동의 구조.
      sources:
        - title: Lessons learned from handling massive traffic with cache
          url: https://medium.com/coupang-engineering/lessons-learned-from-operating-our-data-serving-layer-4e9e4f68fe85
        - title: 타사 온라인 활동기록 무단 저장 보도
          url: https://www.newsis.com/view/NISX20260611_0003665252
    "7":
      level: hi
      here: 이용자 인증 시스템이 서명키로 전자 출입증(인증 토큰)을 발급하고, 관문(게이트웨이) 서버는 서명이 맞으면 정상 접근으로 허용하는 구조였다고 발표됨. 퇴사한 개발자가 재직 중 다루던 서명키로 퇴사 후 토큰을 위조해 정상 인증을 우회.
      risk: 서명키 하나가 전 계정의 문을 엶. 키 회전·폐기가 없으면 퇴사자도 계속 유효한 토큰을 만들 수 있음. 2023 윙 사고도 판매자 로그인 인증 계층 문제(15번).
      study: JWT 등 서명 토큰 구조, 키 회전(kid)·폐기, 토큰 발급 이상 탐지, 게이트웨이 인증 위임.
      sources:
        - title: 서명키 하드코딩 탓에 갱신 못해(보안뉴스)
          url: https://m.boannews.com/html/detail.html?idx=142059
        - title: 조사단이 밝힌 쿠팡의 잘못
          url: https://www.mt.co.kr/tech/2026/02/10/2026021013535454383
    "8":
      level: hi
      here: 조사단은 현직 개발자 노트북에서도 서명키가 하드코딩된 채 저장된 것을 확인했다고 발표. 키는 키 관리 시스템에만 두라는 내부 규정이 있었으나 지켜지지 않음(보도 기준).
      risk: 개발자 단말이 비밀값 저장소가 되면 단말 분실·퇴사·악성코드가 곧 키 유출. 퇴사 절차(오프보딩)에 키·권한 회수가 없으면 내부자 위협이 장기화.
      study: 오프보딩 체크리스트(권한·키 회수), 개발자 단말 시크릿 스캔, 내부자 위협 모델.
      sources:
        - title: 퇴사자가 로그인 키 따로 노트북 저장
          url: https://www.mt.co.kr/tech/2026/02/10/2026021013535454383
    "9":
      level: mid
      here: 2017년 IT 인프라 전체를 AWS로 옮겼고, 이후 AWS 비용 최적화 사례를 블로그에 공개. 2025-07 자체 GPU 클라우드 CIC를 출범하고 외부 클라우드 사업 진출도 보도됨.
      risk: 클라우드 IAM·키 관리(KMS)·메타데이터 노출. 클라우드 사업자를 겸하면 테넌트 격리 책임이 추가됨.
      study: AWS IAM 최소 권한, KMS·Secrets Manager로 서명키 보관, 클라우드 비용·권한 거버넌스.
      sources:
        - title: 쿠팡, IT인프라 전체를 AWS로 이전
          url: https://byline.network/2017/08/10-6
        - title: Cloud expenditure optimization for cost efficiency
          url: https://medium.com/coupang-engineering/cloud-expenditure-optimization-for-cost-efficiency-44e9bea3d91b
        - title: 쿠팡 클라우드 시장 진출 보도
          url: https://byline.network/2025/07/02_29182773/
    "10":
      level: hi
      here: 마이크로서비스 전환 때 클라우드 기반 블루그린 배포 체계를 만들었다고 블로그에 공개. 2025 사건에서는 서명키를 보안 저장소가 아니라 소스코드에 넣어 두어, 키를 바꾸려면 코드를 고쳐야 했기에 퇴사자가 생겨도 갱신하지 않은 것으로 설명됨(과기정통부 설명 보도).
      risk: 소스코드 속 비밀값은 저장소 접근자 모두에게 열림. 2026-10-09 새벽 쿠팡·쿠팡이츠·쿠팡플레이가 약 2시간 접속 장애를 겪었고 쿠팡은 서비스 업그레이드 중 오류라고 설명(해킹은 부인).
      study: 시크릿 스캐닝, 코드와 키 분리(시크릿 매니저), 무중단 배포와 롤백.
      sources:
        - title: Integrating Coupang platform services to a microservice architecture
          url: https://medium.com/coupang-engineering/행복을-찾기-위한-우리의-여정-a31fc2d5a572
        - title: 서명키 하드코딩(보안뉴스)
          url: https://m.boannews.com/html/detail.html?idx=142059
        - title: 2026-10 접속 장애·보상
          url: https://news.mtn.co.kr/news-detail/2026100916342654986
    "11":
      level: hi
      here: 위조 토큰으로 한 접근이 2025-04-14부터 11-08까지 이어졌는데도 자체 탐지하지 못함. 배송지 목록 페이지가 약 1억 4,805만 회 조회됨. 쿠팡은 처음 4,536개 계정으로 신고했다가 11-29 약 3,370만 개로 정정.
      risk: 정상 토큰처럼 보이는 대량 조회는 서명 검증만으로는 못 잡음. 조사단은 인지 후 24시간 내 신고 의무 위반으로 판단(보도 기준).
      study: 계정별 조회량 이상 탐지(UEBA), 침해 신고 의무와 타임라인, 사고 범위 산정 방법.
      sources:
        - title: 합동조사단 결과(뉴시스)
          url: https://mobile.newsis.com/view/NISX20260210_0003510149
        - title: 3,370만 계정 노출 확인
          url: https://mobile.newsis.com/view/NISX20251201_0003423905
    "12":
      level: hi
