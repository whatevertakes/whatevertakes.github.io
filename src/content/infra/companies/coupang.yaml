  summary: 쿠팡의 서비스(쇼핑·로켓배송, 쿠팡이츠, 쿠팡플레이, 쿠팡페이, 판매자 시스템, 물류센터)가 어떤 인프라 위에 있고, 영역마다 무엇이 위험하며, 실제로 어떤 사건이 있었는지를 공개 자료로 정리했습니다. 쿠팡 내부 구조를 확인한 것은 아니며 일부는 보도와 엔지니어링 블로그에서 추정했습니다.
  facts:
    - label: 클라우드
      value: 2017년 AWS로 전면 이전
      detail: 이커머스 IT 인프라 전체를 AWS로 옮겼다고 발표(2017-08). 2025-07 자체 GPU 클라우드 CIC(Coupang Intelligent Cloud) 출범
    - label: 물리
      value: 전국 물류센터 100여 곳
      detail: 대구 풀필먼트센터(2023 공개)에 AGV 1천여 대·소팅봇·무인 지게차. 2021 덕평, 2026 인천 물류센터 대형 화재
    - label: 신고 채널
      value: 이메일 VDP + 대만 HackerOne
      detail: 한국은 취약점 공개 정책 페이지에서 bugbounty@coupang.com 이메일 제보(포상 기준 미공개). 쿠팡 대만은 HackerOne 공개 버그바운티 운영
    - label: 대표 사건
      value: 2025 퇴사자 서명키 유출
      detail: 퇴사한 인증 시스템 개발자가 갱신되지 않은 서명키로 토큰을 위조해 3,367만여 건 유출(민관합동조사단, 2026-02)
