      items:
        - "<b>로그인·토큰(7):</b> 2025 사건의 핵심. 토큰 수명, 로그아웃·비밀번호 변경 후 토큰 무효화가 되는지를 자기 계정으로만 관찰."
        - "<b>마이쿠팡·배송지(14):</b> 내 정보·배송지·주문처럼 개인 객체를 다루는 API의 객체 단위 권한(IDOR)."
        - "<b>윙 판매자 시스템(14·7):</b> 판매자 간 데이터 경계. 2023년 실제 노출 사례가 있어 정책상 범위인지 먼저 확인."
        - "<b>쿠팡이츠 연동 API(14·15):</b> 고객·라이더·점주 세 역할과 외부 주문관리 시스템으로 나가는 응답의 최소화."
        - "<b>쿠팡페이 결제 흐름(14):</b> 금액·주문 상태·쿠폰 같은 비즈니스 로직. 쿠팡페이는 별도 법인이라 신고처 확인."
        - "<b>신고 채널(12):</b> 한국은 VDP 이메일(포상 기준 미공개), 대만은 HackerOne 공개 프로그램. 어느 프로그램 범위인지부터 구분."
      note: 다른 이용자 계정을 대상으로 하거나 데이터를 내려받·수정·삭제하는 테스트는 하지 않습니다. 범위 밖 자산과 물류센터 설비는 건드리지 않습니다.
    - title: 이 해부로 공부하는 순서
      style: ol
      items:
        - "<b>7 → 10:</b> 서명 토큰 구조와 키 회전·폐기. 2025 사건을 조사단 발표 보도로 다시 읽는다."
        - "<b>8 → 11:</b> 퇴사자 권한 회수와 대량 조회 탐지. 왜 7개월 동안 못 잡았는지 정리한다."
        - "<b>14 → 15:</b> 2021 앱 노출, 2023 윙, 쿠팡이츠 API 사건을 권한 분리 관점으로 비교한다."
        - "<b>9 → 4:</b> AWS IAM·KMS와 MSA 서비스 간 인증. 엔지니어링 블로그 MSA·캐시 글을 읽는다."
        - "<b>6 → 12:</b> 광고 활동기록 수집 제재로 개인정보 결합과 과징금 구조를 공부한다."
        - "<b>1 → 13:</b> 물류센터 화재 두 건과 AGV·소팅봇 자동화로 물리·OT 위험을 본다."
      note: 영역마다 블로그 글 한 편으로 마무리하면 「쿠팡 인프라 해부」 시리즈가 됩니다.
