  use:
    - title: 버그바운티로 볼 만한 곳 (범위·규칙 확인이 먼저)
      style: ul
      items:
        - "<b>송금·결제 흐름(14·7):</b> 금액·수취인·상태 값이 서버에서 다시 검증되는지 같은 비즈니스 로직. 제공되는 모의해킹용 별도 환경에서만 본다."
        - "<b>토스페이먼츠 연동 API(14·15):</b> 가맹점용 키의 권한 범위와 키 노출 시 조회 가능한 정보. 2026 사건을 원문으로 읽고 설계 관점에서 본다."
        - "<b>계열사 공식 홈페이지(2·14):</b> 범위에 명시된 웹 자산의 일반적인 웹 취약점."
        - "<b>권한 분리(7·14):</b> 내 계좌·내 거래만 보이는지(IDOR). 다른 이용자 데이터는 절대 조회하지 않는다."
        - "<b>토스인증서·페이스페이(7·13):</b> 인증 단계 설계와 기기 바인딩. 생체정보와 실제 단말은 범위 확인 전에는 건드리지 않는다."
        - "<b>범위 변동 주의(12):</b> 2023년 2회차는 토스뱅크·토스증권이 제외됐고 2024년 상시 운영은 전 계열사 참여로 보도됨. 현재 범위는 공식 페이지에서 확인."
      note: 실제 이용자 데이터에 접근하거나 송금·결제를 방해하는 테스트는 하지 않으며, 범위 밖 자산과 제공된 테스트 환경 밖에서는 시험하지 않습니다.
    - title: 이 해부로 공부하는 순서
      style: ol
      items:
        - "<b>14 → 7:</b> 송금·결제·인증서 흐름. 2020 부정결제를 인증 단계 설계 관점에서 다시 읽는다."
        - "<b>15 → 14:</b> 2026 토스페이먼츠 사건으로 결제 API 키 구조와 가맹점 책임을 정리한다."
        - "<b>6 → 5 → 11:</b> 2024 금감원 제재를 읽고 데이터 결합·하둡 권한·접속기록이 왜 문제였는지 정리한다."
        - "<b>4 → 2:</b> SLASH 발표로 Kubernetes·Istio mTLS 구조, 토스페이먼츠 TLS 1.3·PQC 적용을 본다."
        - "<b>8 → 9:</b> 망분리 규정과 완화 과정, VDI·TITAN·AWS 멀티 어카운트로 금융 사내 IT와 클라우드 경계를 본다."
        - "<b>1 → 16:</b> 액티브-액티브 IDC와 재해복구, 금융권 생성형 AI 규제와 LLM 서빙 인프라."
      note: 영역마다 SLASH·가디언즈 발표 한 편과 블로그 글 한 편을 묶으면 「토스 인프라 해부」 시리즈가 됩니다.
