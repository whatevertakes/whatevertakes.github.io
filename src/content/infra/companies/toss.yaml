    "1":
      level: mid
      here: 자체 IDC 2곳을 2018년부터 액티브-액티브로 운영한다고 밝힘. 2022년 한쪽 IDC를 완전히 차단하는 재해복구훈련을 했고 고객 영향이 없었다고 설명. 2026년 업무 연속성 표준 ISO 22301 인증을 받았다는 보도.
      risk: 금융 서비스는 IDC 한 곳의 화재·전원 사고가 곧 송금·결제 중단. 카카오 판교 화재(2022) 이후 전자금융업자의 이중화·재해복구 책임이 커짐.
      study: 액티브-액티브와 액티브-스탠바이 차이, 전자금융감독규정의 재해복구 요건.
      sources:
        - title: 토스 데이터센터 완전 차단 재해복구훈련
          url: https://toss.im/tossfeed/article/DisasterResponseSystem
        - title: 재해복구훈련 보도
          url: https://www.etnews.com/20221219000166
    "2":
      level: mid
      here: 토스페이먼츠는 2022년 HTTP/3, 2025년 TLS 1.3 전면 적용에 이어 2026-04 결제 전 구간에 양자내성암호(ML-KEM 하이브리드 키 교환)를 적용했다고 발표. 클라우드 쪽은 AWS Shield·WAF를 먼저 도입했다는 사례 공개.
      risk: 결제창은 외부에 열린 접점이라 DDoS와 웹 공격이 몰림. 오늘 모은 암호문을 나중에 푸는 '선수집 후복호화'가 PQC 도입 이유로 제시됨.
      study: TLS 1.3 핸드셰이크, HTTP/3(QUIC), 하이브리드 PQC 키 교환, WAF 규칙 구조.
      sources:
        - title: 토스페이먼츠 양자내성암호 전면 도입
          url: https://toss.im/tossfeed/article/47193
        - title: 토스페이먼츠 클라우드 보안 접근법
          url: https://byline.network/2023/10/11-309
    "3":
      level: lo
      here: IDC에서 시스템·네트워크 엔지니어가 서버와 장비를 직접 운영. 서버 OS와 단말 구성의 세부는 공개되지 않음. 대량 Linux 서버와 모바일 앱(Android·iOS)이 중심일 것으로 추정. (공개 자료 부족, 일반론)
      risk: 금융 앱은 루팅·탈옥 단말, 앱 위변조가 주요 위협. 서버는 패치 지연과 관리 계정 노출이 일반적 위험.
      study: 모바일 앱 무결성 검증(루팅 탐지, 앱 서명), Linux 서버 하드닝.
      sources: []
    "4":
      level: mid
      here: 많은 서버를 관리하려고 Kubernetes를 도입하고 Calico CNI와 Istio 서비스 메시를 채택(2021 보도). SLASH 21에서 Kubernetes·Istio 운영, SLASH 22에서 은행 앱의 서비스 메시 도입, SLASH 23에서 Istio mTLS로 클러스터 내외부 제로 트러스트를 구현한 사례를 발표.
      risk: 서비스 메시 설정 실수(mTLS 예외, 과도한 AuthorizationPolicy), 클러스터 RBAC, 컨테이너 탈출 N-day가 금융 시스템 전체로 번질 수 있음.
      study: Kubernetes RBAC·NetworkPolicy, Istio mTLS와 AuthorizationPolicy, Calico 정책.
      sources:
        - title: 토스의 인프라 구성도
          url: https://byline.network/2021/04/29-107/
        - title: SLASH 22 은행 앱에도 Service Mesh 도입이 가능한가요?
          url: https://toss.im/slash-22/sessions/3-8
        - title: SLASH 23 세션(Istio mTLS 제로 트러스트)
          url: https://toss.im/slash-23/session-detail/A1-7
    "5":
      level: mid
      here: 개인신용정보를 처리하는 하둡 시스템을 운영. 2024 금감원 제재에서 하둡 접속기록을 별도 물리 저장장치에 백업하지 않은 점이 지적됨(보도 기준).
      risk: 분석용 데이터 레이크에는 여러 서비스의 정보가 결합돼 쌓임. 접속기록 보관이 부실하면 사고 뒤 누가 무엇을 봤는지 증명이 어려움.
      study: 하둡 권한 모델(Ranger 등), 접속기록 위변조 방지 보관, 백업 분리.
      sources:
        - title: 금감원 토스 제재 보도
          url: https://www.segye.com/newsView/20241028516823
    "6":
      level: hi
      here: 토스뱅크는 Kubernetes 위에 Spring Boot·Kotlin·JPA로 코어뱅킹을 MSA로 전환 중이며 Kafka(비동기 회계 처리)와 Redis를 채택. 외환 등 새 영역은 MySQL로 구축했고 뼈대는 Oracle 등 레거시가 남아 있다는 보도. 2023-03 채널 연계 DB 서버 오류로 토스뱅크 송금이 30여 분 지연된 일이 있음.
      risk: 2024 금감원은 전자영수증 거래정보 약 2,928만 건을 동의 없이 카드 거래내역과 결합해 분석한 점을 제재(보도 기준). 메시지 큐·캐시에 개인신용정보가 흘러다니는 구조는 권한·암호화 관리가 핵심.
      study: Kafka ACL·암호화, Redis 접근 통제, 신용정보법의 정보 결합 규정(데이터전문기관).
      sources:
        - title: 토스뱅크 코어뱅킹 MSA 전환
          url: https://byline.network/2023/06/08-123
        - title: 토스뱅크 송금 지연 보도
          url: https://biz.sbs.co.kr/amp/article/20000107347
        - title: 금감원 제재 보도(정보 결합)
          url: https://www.smarttoday.co.kr/ko-kr/articles/62781
    "7":
      level: hi
      here: 토스인증서는 2021-11 KISA로부터 전자서명인증사업자로 인정받아 공동인증서를 대체하는 민간 인증서로 쓰임. 송금·결제는 PIN과 기기 인증, 페이스페이는 얼굴 인증을 씀.
      risk: 2020-06 웹결제에서 이름·생년월일·전화번호·PIN만으로 결제가 되는 구조가 도용 정보에 뚫림(금감원은 해킹 아닌 도용으로 잠정 결론). 2024 제재에서는 임직원 261명에게 하둡 전체 조회 권한을 같게 준 점이 지적됨(보도 기준).
      study: 민간 전자서명 구조, 결제 인증 단계 설계(지식·소유·생체), 최소 권한(RBAC).
      sources:
        - title: 토스, 전자서명인증사업자 자격 확보
          url: https://byline.network/2021/11/12-154/
        - title: 토스 부정결제 사건 보도
          url: https://m.boannews.com/html/detail.html?idx=88808
    "8":
      level: mid
      here: 망분리 규정 때문에 업무 PC에서 인터넷이 막힌 환경을 VDI와 원격접속 통제로 운영(가디언즈 25 세션 주제). 외산 SASE(Zscaler)를 대체하는 자체 제로트러스트 접근 시스템 TITAN을 만들어 직원 약 2,000명이 쓴다는 보도(2026-08). ChatGPT 엔터프라이즈를 전사 도입.
      risk: 사내 접근 게이트웨이를 직접 만들면 그 자체가 핵심 공격 표면. 망분리 예외 구간(VDI·원격접속), 외부 AI 도구로의 데이터 반출 통제가 관건.
      study: SASE·ZTNA 구조, VDI 보안, 망분리 규정(전자금융감독규정 제15조)과 예외.
      sources:
        - title: 토스 자체 SASE 타이탄 보도
          url: https://zdnet.co.kr/view?no=20260831231056
        - title: 가디언즈 25 세션 목록
          url: https://toss.im/guardians-25
        - title: IT 기업인데 인터넷 하면 안 된다고?(망분리)
          url: https://byline.network/2019/08/20-61
        - title: 토스 챗GPT 유료 계정 도입
          url: https://toss.im/tossfeed/article/chatgpt
    "9":
      level: mid
      here: 본체는 자체 IDC 중심이고 일부 서비스는 AWS를 함께 씀. 토스페이먼츠는 출범 때부터 클라우드를 쓰며 단일 계정을 멀티 어카운트로 나눴다고 소개. 토스증권은 미국 옵션 실시간 시세 파이프라인을 AWS에 구축한 사례 공개. 금융권 망분리·클라우드 규제는 SaaS 예외 제도화(2026)를 거쳐 전면 해제 추진이 보도됨.
      risk: 금융 데이터가 IDC와 클라우드 양쪽에 있으면 IAM·계정 경계·로그가 둘로 갈림. 규제 완화 과도기에 예외 구간이 늘어남.
      study: AWS 멀티 어카운트(Organizations·SCP), 금융 클라우드 이용 가이드, 망분리 완화 로드맵.
      sources:
        - title: 토스페이먼츠 클라우드 보안 접근법
          url: https://byline.network/2023/10/11-309
        - title: 토스증권 옵션 실시간 파이프라인(AWS 블로그)
          url: https://aws.amazon.com/ko/blogs/tech/toss-securities-nasdaq-options-realtime-pipeline
        - title: 금융권 망분리 전면 해제 추진 보도
          url: https://www.ddaily.co.kr/page/view/2026071517443276094
    "10":
      level: lo
      here: 수많은 마이크로서비스를 Kubernetes에 배포하므로 사내 CI/CD가 있을 것으로 추정되나 구체 구성은 공개 자료에서 확인하지 못함. (공개 자료 부족, 일반론)
      risk: CI 비밀값, 빌드 러너 권한, 배포 파이프라인 탈취는 곧 금융 시스템 코드 변조. 망분리 환경에서는 외부 레지스트리 연결 구간이 약점이 되기 쉬움.
      study: CI 비밀값 관리, 배포 승인·서명, GitOps 권한 분리.
      sources: []
    "11":
      level: mid
      here: 토스뱅크는 망분리 환경에서 대시보드 약 5,700개를 코드로 자동 운영한 사례를 공개. 개인신용정보 시스템의 접속기록 보관은 2024 제재에서 지적된 부분.
      risk: 관측·BI 시스템은 전 서비스 데이터를 모아 보는 곳이라 권한이 과하면 내부 유출 통로가 됨. 접속기록이 없으면 사고 조사 자체가 불가능.
      study: 감사 로그 설계, 로그 무결성 보관, 대시보드 권한 관리.
      sources:
        - title: 토스뱅크 대시보드 자동화(Tableau 사례)
          url: https://www.tableau.com/ko-kr/solutions/customer/toss-bank-automates-dashboard-operation-with-tableau
    "12":
      level: hi
      here: 자체 버그바운티 상시 운영, 보안 컨퍼런스 가디언즈(2024~2026) 개최. FDS는 확실한 부정거래를 자동 차단하고 의심 거래는 모니터링 팀이 본다고 설명. 2020-07 명의도용 피해까지 보상하는 안심보상제 도입.
      risk: 2024-10 금감원은 신용정보 결합·동의 절차·전산 안전보호 의무 위반으로 과징금 약 53.7억 원 등을 부과(보도 기준). 2022 보험 상담 고객정보 유상 제공은 금감원이 위법은 아니라고 봤지만 논란이 됨.
      study: FDS 구조(룰+머신러닝), 신용정보법·전자금융거래법 제재 사례 읽기, 버그바운티 정책 읽기.
      sources:
        - title: 토스 버그바운티 챌린지 상시 운영
          url: https://toss.im/tossfeed/article/bugbountychallenge
        - title: 토스 FDS 소개
          url: https://toss.im/tossfeed/article/fraud_detection_toss
        - title: 금감원 토스 제재 보도
          url: https://www.kukinews.com/article/view/kuk202410280043
        - title: 토스 보험 데이터 판매 팩트체크
          url: https://byline.network/2022/06/10-233
    "13":
      level: mid
      here: 금융 고유 인프라로 오프라인 결제 단말의 얼굴 인식 결제(페이스페이), 증권 실시간 시세 수신, 은행 대외 연계망이 있음. 페이스페이는 보안을 전면에 내세우며 양자내성암호 적용도 연구 중이라고 설명(보도).
      risk: 생체정보는 유출되면 바꿀 수 없음. 매장 단말은 물리 접근이 가능한 공격 표면. 2026 토스페이먼츠 사건 때 페이스페이 우려 보도가 나왔으나 전문가들은 직접 연결은 아니라고 설명.
      study: 생체 인증 템플릿 보호, 결제 단말 보안(PCI PTS 개념), 대외 금융망 구조.
      sources:
        - title: 토스 페이스페이 보안 보도
          url: https://m.boannews.com/html/detail.html?idx=139032
    "14":
      level: hi
      here: 송금, 인증서, 토스뱅크, 토스증권, PG 결제창, 보험, 자산조회를 한 앱에 담은 금융 수퍼앱. 결제 API는 가맹점이 인증키로 연동.
      risk: 결제·송금 비즈니스 로직, 권한 분리(IDOR), 웹결제 인증 단계 부족(2020 부정결제). 2026-09 가맹점 연동키 노출로 결제내역 4,131건이 조회됨.
      study: 결제 API 인증 방식(시크릿 키와 클라이언트 키 구분), 송금 흐름 위변조 점검.
      sources:
        - title: 토스페이먼츠 결제내역 조회 사고 보도
          url: https://magazine.hankyung.com/business/article/202609094979b
        - title: 토스페이먼츠 4,131건 보도
          url: https://biz.sbs.co.kr/amp/article/20000333694
    "15":
      level: hi
      here: PG는 수많은 가맹점 웹사이트가 토스페이먼츠 연동키를 들고 있는 구조. 오픈소스 쪽은 npm·pip·maven 새 버전을 일정 기간 막는 쿨다운 기반 '공급망 방화벽'을 운영한다고 OWASP Seoul(2026-06)에서 발표.
      risk: 2026-09 사건의 시작점은 토스가 아니라 가맹점 웹사이트였음. 의존 패키지 탈취(악성 버전 배포)는 빌드에 바로 들어옴.
      study: 패키지 쿨다운·사설 레지스트리, SBOM, 제3자(가맹점) 키 관리 가이드.
      sources:
        - title: 토스의 공급망 보안 대응 전략(OWASP Seoul)
          url: "https://owasp.org/www-chapter-seoul/assets/files/2026%20June%20%ED%91%9C%EC%83%81%EC%98%81%20-%20%ED%86%A0%EC%8A%A4%EC%9D%98%20%EA%B3%B5%EA%B8%89%EB%A7%9D%20%EB%B3%B4%EC%95%88%20%EB%8C%80%EC%9D%91%20%EC%A0%84%EB%9E%B5.pdf"
        - title: 토스페이먼츠 가맹점 연동키 노출 보도
          url: https://news.mtn.co.kr/news-detail/2026090914330522394
    "16":
      level: mid
      here: 채용 공고 기준으로 온프레미스와 멀티 클라우드를 아우르는 GPU Kubernetes 위에서 vLLM·SGLang 등으로 LLM 서빙을 구성하고 RDMA 네트워크와 고성능 AI 스토리지를 다룸. 사내는 ChatGPT 엔터프라이즈 전사 도입. 금융권 생성형 AI는 망분리 예외에서 아직 개별 승인 대상이라는 보도.
      risk: 모델 서빙 인프라의 GPU 클러스터 권한, 사내 AI 도구로의 금융정보 입력, 고객 상담 AI의 프롬프트 인젝션.
      study: LLM 서빙 구조(vLLM), LLM 앱 위협 모델(MITRE ATLAS), 금융권 생성형 AI 규제.
      sources:
        - title: 토스 AI 플랫폼 엔지니어 채용 공고
          url: https://toss.im/career/job-detail?gh_jid=8007436003
        - title: 금융권 망분리 완화와 SaaS(생성형 AI 제외) 보도
          url: https://v.daum.net/v/20260420164307165
