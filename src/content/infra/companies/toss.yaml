incidents: []
bounty:
  status: yes
  note: "'토스 버그바운티 챌린지' 상시 운영. 토스 앱 주요 서비스와 계열사 공식 홈페이지 대상, 건당 최대 3천만 원(보도 기준)"
  url: https://www.techm.kr/news/articleView.html?idxno=120328
tip: 국내에서 바운티로 실전을 쌓기 좋은 대상. 결제·인증 로직(14·7)과 금융 규제 아래의 인프라 구조를 함께 공부.
blog: https://toss.tech/
deep:
  summary: 토스(비바리퍼블리카)와 토스뱅크·토스증권·토스페이먼츠가 어떤 인프라 위에 있고, 영역마다 무엇이 위험하며, 실제로 어떤 사건과 제재가 있었는지를 공개 자료(공식 블로그·SLASH·가디언즈 발표, 보도, 금감원 제재 보도)로 정리했습니다. 토스 내부 구조를 확인한 것은 아니며 일부는 공개 자료에서 추정했습니다.
  facts:
    - label: 물리
      value: 자체 IDC 2곳, 액티브-액티브
      detail: 2018년부터 IDC 이중화를 액티브-액티브로 운영. 2022년 한쪽 IDC를 실제로 끊는 재해복구훈련을 했다고 밝힘
    - label: 규제
      value: 망분리 아래의 금융 인프라
      detail: 전자금융감독규정 망분리 때문에 업무 PC에서 인터넷을 못 쓰는 구조. 토스페이먼츠·토스증권 일부는 AWS도 함께 씀
    - label: 신고 채널
      value: 버그바운티 상시 운영
      detail: 2022년 첫 개최 후 2024-02부터 전 계열사 상시 운영. 건당 최대 3천만 원(보도 기준)
    - label: 대표 사건
      value: 2026 토스페이먼츠 결제내역 조회
      detail: 가맹점 웹사이트에서 결제연동 인증키 노출 → 제3자가 결제내역 4,131건(2,671명) 조회. 회사는 자사 시스템 침입은 아니라고 설명
