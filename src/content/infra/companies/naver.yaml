  use:
    - title: 버그바운티로 볼 만한 곳 (범위·규칙 확인이 먼저)
      style: ul
      items:
        - <b>네이버 로그인 연동(7·14):</b> 외부 사이트가 네이버 로그인을 붙일 때의 OAuth 흐름. 연동 결함은 연동한 서비스의 문제일 수 있으니 신고처를 구분.
        - <b>스마트스토어(14·7):</b> 구매자·판매자·운영자 세 역할이 같은 데이터를 다른 권한으로 본다. 권한 분리(IDOR)가 핵심.
        - <b>네이버페이 결제 흐름(14):</b> 금액·주문 상태·포인트 같은 비즈니스 로직.
        - <b>웨일 브라우저(3·15):</b> Chromium 상위 패치가 얼마나 빨리 반영되는지.
        - <b>AI 검색·HyperCLOVA X(16):</b> 검색 대상 문서에 숨은 지시문이 AI 답변에 섞이는 간접 프롬프트 인젝션.
        - <b>NCP 콘솔·IAM(9):</b> 클라우드 사업자의 계정·권한 경계. 테스트는 자기 계정 안에서만.
      note: 실제 이용자 데이터에 접근하거나 서비스를 방해하는 테스트는 하지 않습니다. 범위 밖 자산은 건드리지 않습니다.
    - title: 이 해부로 공부하는 순서
      style: ol
      items:
        - <b>14 → 7:</b> 로그인·결제·스마트스토어 흐름. 바운티와 가장 가깝다.
        - <b>9 → 4:</b> NCP 무료 체험으로 IAM·Kubernetes(NKS)·Object Storage를 직접 만져 본다.
        - <b>16 → 13:</b> HyperCLOVA X와 GPU 클러스터, 1784 로봇의 5G 특화망.
        - <b>11 → 6:</b> 네이버 오픈소스 Pinpoint·ARCUS를 설치해 구조를 본다.
        - <b>8 → 15:</b> LINE 사건을 원문 공지로 다시 읽고 공유 인증 체계가 왜 위험했는지 정리한다.
        - <b>1 → 2:</b> 각 세종 공개 자료, 데이터센터 이중화 규제, 대규모 라이브 스트리밍 트래픽.
      note: 영역마다 블로그 글 한 편으로 마무리하면 「네이버 인프라 해부」 시리즈가 됩니다.
