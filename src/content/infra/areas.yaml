# 인프라 16개 영역. id는 문자열 "1"~"16". oss는 oss/ 파일 이름(확장자 제외)을 참조
- id: "1"
  name: 물리
  en: Facility & Hardware
  bounty: lo
  summary: 데이터센터, 전원(UPS), 냉각, 랙, 서버 하드웨어, BMC/IPMI, 회선
  korea: 대형 서비스도 자체·임대 IDC 의존이 큼. 2022년 판교 데이터센터 화재로 카카오 서비스가 장기간 멈추며 이중화·DR이 사회 문제로 부각됨.
  oss:
    - openbmc
    - redfish
    - network-ups-tools
  questions:
    operator: 전원·회선·BMC를 왜 이중화하나?
    attacker: BMC 관리망에 들어가면 서버 전원·콘솔을 쥔다
    defender: BMC 접근 로그, 관리망 분리 여부
  links:
    - pm
    - eol
- id: "2"
  name: 네트워크
  en: Network
  bounty: mid
  summary: 라우팅, 방화벽·DMZ·망분리, 로드밸런서·프록시·CDN, VPN·VDI·ZTNA, DNS
  korea: 공공·금융은 망분리가 의무 수준이고 국산 방화벽·VPN·망연계 솔루션 비중이 큼. 2021년 KT 전국 인터넷 장애는 라우팅 설정 오류가 원인으로 발표됨.
  oss:
    - nginx
    - haproxy
    - envoy
    - bind
    - coredns
    - wireguard
    - openvpn
    - opnsense
  questions:
    operator: 트래픽이 어떤 장비를 거쳐 서버에 닿나?
    attacker: 경계 VPN·방화벽은 인증 전 공격 표면 → 내부망 입구
    defender: 경계 장비 로그, 비정상 세션
  links:
    - kev
    - attack
    - pm
- id: "3"
  name: 컴퓨팅·OS
  en: Compute / OS
  bounty: lo
  summary: Linux 서버(서비스), Windows 서버(사내), 단말 Windows·macOS·모바일
  korea: 서비스 서버는 Linux(RHEL 계열·Ubuntu), 사내는 Windows. 2025년 SKT 유심 정보 유출에서 Linux 서버에 잠복한 BPFDoor 악성코드가 확인됨.
  oss:
    - linux-kernel
    - openssh
    - systemd
    - polkit
    - sudo
  questions:
    operator: 서비스는 어떤 계정·권한으로 도나?
    attacker: 일반 권한 → root, 서버 장악 후 장기 잠복
    defender: 프로세스·네트워크 이상, EDR
  links:
    - attack
    - eol
- id: "4"
  name: 가상화·컨테이너
  en: Virtualization
  bounty: mid
  summary: VMware·Hyper-V·KVM·Proxmox, VDI, Docker·레지스트리, Kubernetes
  korea: 공공·대기업 내부는 VMware 계열, 빅테크는 Kubernetes 기반 플랫폼이 표준. 기술블로그에 K8s 이전기가 많음.
  oss:
    - docker
    - containerd
    - runc
    - kubernetes
    - ingress-nginx
    - harbor
    - proxmox
    - qemu
  questions:
    operator: 격리는 어디서 깨질 수 있나?
    attacker: 컨테이너 → 노드 → 클러스터, 하이퍼바이저 → 모든 VM
    defender: K8s audit log, 런타임 탐지
  links:
    - cncf
    - k8saf
    - kev
- id: "5"
  name: 스토리지·백업
  en: Storage
  bounty: mid
  summary: SAN·iSCSI, NAS·NFS·SMB, S3 계열·Ceph, 백업·DR
  korea: 중소 기업은 NAS 의존이 큼. 2017년 국내 웹호스팅 업체가 랜섬웨어로 서버와 백업이 함께 암호화돼 큰 피해를 입음.
  oss:
    - minio
    - ceph
    - samba
    - nfs
    - restic
    - bacula
  questions:
    operator: 백업은 운영망과 분리돼 있나?
    attacker: 공격자는 랜섬웨어 전에 백업부터 지운다
    defender: 백업 삭제·대량 읽기 탐지
  links:
    - cncf
    - kev
- id: "6"
  name: 데이터·미들웨어
  en: Data & Middleware
  bounty: mid
  summary: Nginx·Apache·IIS·Tomcat, RDBMS·NoSQL, Redis, Kafka, Elasticsearch, API 게이트웨이
  korea: 공공·금융은 상용 WAS(JEUS 등)와 Oracle·국산 DB, 빅테크는 Tomcat 내장 Spring Boot + MySQL·Redis·Kafka가 일반적.
  oss:
    - apache-tomcat
    - apache-http-server
    - redis
    - apache-kafka
    - elasticsearch
    - kong
    - apache-log4j
  questions:
    operator: 관리 포트·엔드포인트가 밖에 열려 있나?
    attacker: 무인증 캐시·검색엔진은 데이터와 실행의 통로
    defender: 미들웨어 접근 로그, 노출 스캔
  links:
    - kev
    - eol
    - osv
- id: "7"
  name: 아이덴티티
  en: Identity & Access
  bounty: hi
  summary: AD·LDAP, Kerberos·NTLM, SAML·OAuth·OIDC, Entra ID·Okta, PKI, PAM
  korea: 사내는 AD가 보편. 한국 특화로 휴대폰 본인인증, 공동인증서·금융인증서, 간편인증 연동이 서비스마다 붙어 있음.
  oss:
    - keycloak
    - freeipa
    - openldap
    - samba-ad
    - authelia
  questions:
    operator: 로그인 후 무엇이 신원을 증명하나(세션·토큰)?
    attacker: 토큰·서명키·도메인 관리자 = 전부의 열쇠
    defender: 인증 로그, 비정상 토큰 발급
  links:
