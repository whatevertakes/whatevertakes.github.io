    defender: 관리 도구 배포 이력, 메일 게이트웨이 로그
  links:
    - selfhost
    - kev
    - boho
- id: "9"
  name: 클라우드
  en: Cloud
  bounty: hi
  summary: IaaS·PaaS·SaaS, AWS·Azure·GCP·국내 클라우드, IAM·VPC·스토리지
  korea: 빅테크·스타트업은 AWS 비중이 큼. 공공은 CSAP 인증을 받은 국내 클라우드(네이버·KT·NHN 등)로 전환 중.
