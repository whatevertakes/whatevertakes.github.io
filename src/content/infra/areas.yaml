- id: "8"
  name: 사내 IT
  en: Corporate IT
  bounty: mid
  summary: GPO·SCCM·Intune·MDM, 패치 관리, 메일·그룹웨어·메신저·파일 공유, SaaS
  korea: 국산 그룹웨어·메신저와 PC 보안 에이전트(DRM, NAC, 키보드 보안 등) 설치 문화. 국산 SW 취약점은 KISA 신고포상제 대상.
